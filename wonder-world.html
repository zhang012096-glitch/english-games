<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wonder World 尋寶挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion: a classroom game for 8-9 year olds, premium navy and gold as the teacher asked
   IDEA   a treasure hunt: every right answer earns a gold coin on the treasure trail
   PICTURE the question card itself, large and centred, with its picture drawn big
   COLOUR navy ground, white cards, gold for coins and wins, royal blue for actions
   TYPE   Fredoka for English words, Noto Sans TC for Chinese
   LAYOUT top bar (title, team scores), coin trail, big question card, 2x2 answers; phone stacks answers 2x2 smaller */
:root{color-scheme:dark;--navy:#0E2341;--navy2:#16325C;--royal:#1F4E8C;--sky:#3C78C3;--gold:#C9A227;--gold2:#E6CB80;--goldd:#9C7414;--ivory:#FFFFFF;--ink:#1B2433;--mute:#5A6272;--ok:#2E8B57;--bad:#C0392B}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--navy);background-image:radial-gradient(circle at 15% 10%,#1d3d6e 0,transparent 40%),radial-gradient(circle at 90% 90%,#1a3762 0,transparent 45%);color:#fff;font:16px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:clip}
.en{font-family:Fredoka,"Noto Sans TC",system-ui,sans-serif}
.app{max-width:1100px;margin:0 auto;padding:14px max(16px,3vw) 24px;min-height:100%;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(22px,3.2vw,32px);line-height:1.05;letter-spacing:-.01em;font-weight:900;flex:1 1 auto}
header h1 b{color:var(--gold2);font-weight:900}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;background:var(--navy2);border:1px solid #2b4b7c;font-weight:700;white-space:nowrap}
.pill .n{font-family:Fredoka;font-size:22px;line-height:1}
.team-b{border-color:var(--sky)}.team-g{border-color:var(--gold)}
.team-on{box-shadow:0 0 0 3px var(--gold2)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.btn{min-height:48px;padding:10px 22px;border-radius:14px;background:var(--gold);color:var(--navy);font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--goldd)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--goldd)}
.btn.alt{background:var(--royal);color:#fff;box-shadow:0 4px 0 #12345f}
.ghost{background:transparent;border:1px solid #3a5a8a;border-radius:12px;min-height:44px;padding:8px 14px;color:#dfe7f3;font-weight:700}
/* start */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--navy2);border:1px solid #2b4b7c;border-radius:20px;padding:18px}
.panel h2{margin:0 0 4px;font-size:20px;color:var(--gold2)}
.panel p{margin:0 0 12px;color:#c9d5e8;font-size:15px}
.islands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.isl{background:#fff;color:var(--ink);border-radius:16px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px;border:3px solid transparent;transition:transform .15s}
.isl:hover{transform:translateY(-3px)}
.isl[aria-pressed=true]{border-color:var(--gold);background:#fff8e4}
.isl .ic{font-size:40px;line-height:1.15}
.isl .nm{font-family:Fredoka;font-weight:700;font-size:17px;color:var(--navy)}
.isl .zh{font-size:13px;color:var(--mute);font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border-radius:12px;background:#0f2a50;border:2px solid #2b4b7c;font-weight:900;color:#dfe7f3}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;color:#dfe7f3;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--gold)}
.howto{margin:4px 0 0;padding-left:20px;color:#c9d5e8;font-size:14px}
.howto li{margin-bottom:4px}
/* trail */
.trail{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:Fredoka;font-weight:700;font-size:15px;background:#0f2a50;border:2px dashed #3a5a8a;color:#8ea3c4}
.coin.ok{background:radial-gradient(circle at 35% 30%,#f6e3a6,var(--gold) 60%,var(--goldd));border:2px solid #f2d98a;color:var(--navy)}
.coin.no{background:#2a3550;border:2px solid #4a5878;color:#a9b4c9}
.coin.now{border:3px solid var(--gold2);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
/* card */
.stage{flex:1;display:flex;flex-direction:column;gap:14px}
.card{position:relative;background:#fff;color:var(--ink);border-radius:24px;padding:clamp(16px,3vw,28px);text-align:center;box-shadow:0 8px 0 #0a1a31;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.tag{position:absolute;left:16px;top:14px;font-size:14px;font-weight:900;color:var(--royal);background:#eaf0f8;border-radius:999px;padding:4px 12px}
.turn{position:absolute;right:16px;top:14px;font-size:14px;font-weight:900;border-radius:999px;padding:4px 12px;color:#fff}
.ask{font-size:clamp(18px,2.6vw,24px);font-weight:900;color:var(--navy);margin-top:18px}
.big{font-size:clamp(72px,12vw,120px);line-height:1.1}
.count{font-size:clamp(34px,6vw,54px);line-height:1.2;max-width:560px;word-break:break-all}
.swatch{width:clamp(110px,16vw,150px);aspect-ratio:1;border-radius:50%;border:5px solid var(--navy)}
.letter{font-family:Fredoka;font-weight:700;font-size:clamp(80px,13vw,128px);line-height:1;color:var(--navy)}
.letter small{display:block;font-size:26px;color:var(--goldd);margin-top:6px}
.sent{font-family:Fredoka;font-size:clamp(24px,4vw,38px);font-weight:600;color:var(--ink);line-height:1.3}
.sent .blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--gold);margin:0 .15em;color:var(--royal)}
.hint{font-size:15px;color:var(--mute);font-weight:700}
.speak{width:96px;height:96px;border-radius:50%;background:var(--royal);font-size:46px;box-shadow:0 6px 0 #12345f}
.speak.sm{width:52px;height:52px;font-size:24px;box-shadow:0 4px 0 #12345f}
.dlg{font-family:Fredoka;font-size:clamp(24px,3.6vw,34px);font-weight:600;color:var(--navy);display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ans{position:relative;min-height:86px;border-radius:18px;background:#fff;color:var(--ink);font-family:Fredoka;font-weight:600;font-size:clamp(20px,2.8vw,28px);padding:10px 14px 10px 52px;box-shadow:0 5px 0 #0a1a31;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;border:3px solid transparent}
.ans .k{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--gold2);font-size:16px;display:grid;place-items:center}
.ans .em{font-size:clamp(46px,7vw,64px);line-height:1}
.ans .sw{width:56px;height:56px;border-radius:50%;border:3px solid var(--navy)}
.ans:hover:not([disabled]){border-color:var(--gold2)}
.ans.right{background:#e3f4ea;border-color:var(--ok)}
.ans.wrong{background:#f9e3e0;border-color:var(--bad);animation:shake .35s}
.ans[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--navy2);border:1px solid #2b4b7c;border-radius:16px;padding:10px 14px}
.feedback .msg{font-weight:900;font-size:18px}
.feedback .msg .en{color:var(--gold2);font-size:20px}
.feedback .sub{font-size:14px;color:#c9d5e8;font-weight:500}
/* end */
.end{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.trophy{background:#fff;color:var(--ink);border-radius:24px;padding:24px;text-align:center;box-shadow:0 8px 0 #0a1a31}
.trophy .t{font-size:90px;line-height:1.1}
.trophy h2{margin:6px 0 2px;font-family:Fredoka;font-size:40px;color:var(--navy);line-height:1.05}
.stars{font-size:44px;letter-spacing:6px;color:var(--gold)}
.stars .off{color:#d9dee8}
.score{font-size:18px;font-weight:900;color:var(--mute)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.review li{display:flex;align-items:center;gap:12px;background:#0f2a50;border-radius:14px;padding:8px 12px}
.review .e{font-size:34px;width:44px;text-align:center}
.review .w{font-family:Fredoka;font-size:20px;font-weight:600;color:var(--gold2)}
.review .s{font-size:14px;color:#c9d5e8}
.row{display:flex;gap:10px;flex-wrap:wrap}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.hide{display:none!important}
@media (max-width:760px){.intro,.end{grid-template-columns:minmax(0,1fr)}.islands{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.islands{grid-template-columns:repeat(2,minmax(0,1fr))}.ans{min-height:72px;padding-left:46px}.coin{width:26px;height:26px;font-size:12px}.card{min-height:220px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <header>
    <h1>Wonder World <b>尋寶挑戰</b></h1>
    <span id="scoreSolo" class="pill hide">⭐ <span class="n" id="soloN">0</span> / <span id="soloT">10</span></span>
    <span id="scoreB" class="pill team-b hide">🔵 藍隊 <span class="n" id="bN">0</span></span>
    <span id="scoreG" class="pill team-g hide">🟡 金隊 <span class="n" id="gN">0</span></span>
    <button class="ghost hide" id="quit" type="button">回地圖</button>
  </header>

  <!-- START -->
  <section id="start" class="intro">
    <div class="panel">
      <h2>1．選一座寶藏島</h2>
      <p>每一題答對就拿到一枚金幣，10 題收集越多越厲害！</p>
      <div class="islands" id="islands"></div>
    </div>
    <div class="panel opts">
      <h2>2．怎麼玩？</h2>
      <div class="seg" role="group" aria-label="遊戲模式">
        <button type="button" id="mSolo" aria-pressed="true">一個人玩</button>
        <button type="button" id="mTeam" aria-pressed="false">藍隊 vs 金隊</button>
      </div>
      <div class="seg" role="group" aria-label="題數">
        <button type="button" id="n10" aria-pressed="true">10 題</button>
        <button type="button" id="n20" aria-pressed="false">20 題</button>
      </div>
      <label class="chk"><input type="checkbox" id="voice" checked> 唸出英文（🔊 發音）</label>
      <ol class="howto">
        <li>聽一聽、看一看，選出正確答案。</li>
        <li>也可以按鍵盤 1～4 作答，按 Enter 下一題。</li>
        <li>兩隊模式會輪流作答，答對的隊伍加 1 分。</li>
      </ol>
      <button class="btn" id="go" type="button">出發尋寶！</button>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" class="stage hide">
    <div class="trail" id="trail" aria-label="金幣進度"></div>
    <div class="card" id="card"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="fb">
      <div><div class="msg" id="msg">選出你的答案吧！</div><div class="sub" id="sub">按 🔊 可以再聽一次</div></div>
      <button class="btn alt hide" id="next" type="button">下一題 →</button>
    </div>
  </section>

  <!-- END -->
  <section id="end" class="end hide">
    <div class="trophy">
      <div class="t" id="tIcon">🏆</div>
      <h2 id="tTitle">寶藏到手！</h2>
      <div class="stars" id="stars"></div>
      <div class="score" id="tScore"></div>
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn" id="again" type="button">再玩一次</button>
        <button class="btn alt" id="home" type="button">換一座島</button>
      </div>
    </div>
    <div class="panel">
      <h2>再練習一下這些字</h2>
      <p id="revNote">按 🔊 聽單字和影片裡的例句。</p>
      <ul class="review" id="review"></ul>
    </div>
  </section>
</div>

<script>

let AC = null;
function tone(freqs, dur = 0.12) {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  freqs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle"; o.frequency.value = f; const t = AC.currentTime + i * dur; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.6); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur * 1.8); });
}
let VOICE = null;
function pickVoice() { try { const v = speechSynthesis.getVoices(); VOICE = v.find((x) => /en-US/i.test(x.lang) && /Samantha|Google US|Aria|Jenny|Zira/i.test(x.name)) || v.find((x) => /en-US/i.test(x.lang)) || v.find((x) => /^en/i.test(x.lang)) || null; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function say(text, rate = 0.82) {
  if (!S.voice || !text) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate; if (VOICE) u.voice = VOICE; speechSynthesis.speak(u); } catch (e) {}
}

// ---------- question builders ----------
const pool = (unit) => unit === "all" ? ALL : unit === "abc" ? [] : ALL.filter((x) => x.unit === unit);
function others(arr, n, keyFn, notKey) { const seen = new Set([notKey]); const out = []; for (const x of shuffle(arr)) { const k = keyFn(x); if (!seen.has(k)) { seen.add(k); out.push(x); } if (out.length >= n) break; } return out; }
const picOf = (x) => x.kind === "color" ? `<span class="sw" style="background:#${x.hex}"></span>` : x.kind === "num" ? `<span class="en" style="font-size:46px;color:var(--navy)">${x.n}</span>` : `<span class="em">${x.e}</span>`;
const bigPic = (x) => x.kind === "color" ? `<div class="swatch" style="background:#${x.hex}"></div>` : x.kind === "num" ? `<div class="count">${x.e.repeat(x.n)}</div>` : `<div class="big">${x.e}</div>`;
const concrete = (x) => x.kind !== "word";

function qListen(x, p) {
  const opts = [x].concat(others(p.filter(concrete), 3, (y) => y.w, x.w));
  return { tag: "聽一聽", ask: "聽英文，選出正確的圖！", show: `<button class="speak" type="button" data-say="${esc(x.w)}" aria-label="再聽一次">🔊</button>`, sayNow: x.w,
    opts: shuffle(opts).map((y) => ({ v: y.w, h: picOf(y) })), ans: x.w, rev: x };
}
function qLook(x, p) {
  const opts = [x].concat(others(p.filter(concrete), 3, (y) => y.w, x.w));
  return { tag: "看一看", ask: x.kind === "num" ? "How many? 有幾個？" : x.kind === "color" ? "What color is it? 這是什麼顏色？" : "這是什麼？選出英文！", show: bigPic(x), opts: shuffle(opts).map((y) => ({ v: y.w, h: esc(y.w) })), ans: x.w, rev: x };
}
function qSentence(x, p) {
  const cap = /^[A-Z]/.test(x.hl);
  const fmt = (w) => cap ? w[0].toUpperCase() + w.slice(1) : (w === "I" ? w : w.toLowerCase());
  const cands = others(p.filter((y) => y.hl.toLowerCase() !== x.hl.toLowerCase()), 6, (y) => y.hl.toLowerCase(), x.hl.toLowerCase()).map((y) => fmt(y.hl)).filter((w) => w !== x.hl).slice(0, 3);
  const i = x.s.indexOf(x.hl);
  const sent = esc(x.s.slice(0, i)) + `<span class="blank">&nbsp;</span>` + esc(x.s.slice(i + x.hl.length));
  return { tag: "影片例句", ask: "這句話少了哪個字？", show: `<div class="big" style="font-size:64px">${x.e}</div><div class="sent">${sent}</div><div class="hint">${esc(x.szh)}</div>`, sayNow: null,
    opts: shuffle([x.hl].concat(cands)).map((w) => ({ v: w, h: esc(w) })), ans: x.hl, rev: x, full: x.s };

function qLetterPic(p) {

function build(unit, total) {
  const out = [], P = pool(unit);
  const phon = () => { const p = PH.filter((x) => x.L !== "Xx")[rnd(25)]; return Math.random() < 0.5 ? qLetterPic(p) : qLetterListen(p.words[rnd(2)]); };
  const dl = DLG.filter((d) => unit === "all" || d.u === unit);
  let tries = 0;
  const used = new Set();
  while (out.length < total && tries++ < 500) {
    let q;
    if (unit === "abc") q = phon();
    else {
      const r = Math.random();
      if (unit === "all" && r < 0.18) q = phon();
      else if (dl.length && r < 0.34) q = qDialog(dl[rnd(dl.length)]);
      else {
        const x = P[rnd(P.length)];
        const t = Math.random();
        q = !concrete(x) || t < 0.34 ? qSentence(x, P.length > 4 ? P : ALL) : t < 0.67 ? qListen(x, P.filter(concrete).length >= 4 ? P : ALL) : qLook(x, P.filter(concrete).length >= 4 ? P : ALL);
      }
    }
    const key = q.tag + q.ans + q.ask;
    if (used.has(key) && tries < 400) continue;
    used.add(key); out.push(q);
  }
  return out;
}

// ---------- rendering ----------
function renderIslands() {
  $("islands").innerHTML = ISL.map((i) => `<button class="isl" type="button" data-u="${i.id}" aria-pressed="${S.unit === i.id}"><span class="ic">${i.icon}</span><span class="nm">${i.name}</span><span class="zh">${i.zh}</span></button>`).join("");
}
function show(id) { ["start", "play", "end"].forEach((s) => $(s).classList.toggle("hide", s !== id)); const playing = id !== "start"; $("quit").classList.toggle("hide", !playing); $("scoreSolo").classList.toggle("hide", !(playing && S.mode === "solo")); ["scoreB", "scoreG"].forEach((s) => $(s).classList.toggle("hide", !(playing && S.mode === "team"))); }
function scores() { $("soloN").textContent = S.score; $("soloT").textContent = S.qs.length; $("bN").textContent = S.team[0]; $("gN").textContent = S.team[1]; const t = S.qi % 2; $("scoreB").classList.toggle("team-on", S.mode === "team" && t === 0 && !$("play").classList.contains("hide")); $("scoreG").classList.toggle("team-on", S.mode === "team" && t === 1 && !$("play").classList.contains("hide")); }
function trail() { $("trail").innerHTML = S.qs.map((q, i) => `<span class="coin ${q.res === true ? "ok" : q.res === false ? "no" : i === S.qi ? "now" : ""}">${q.res === true ? "★" : i + 1}</span>`).join(""); }
function renderQ() {
  const q = S.qs[S.qi]; S.answered = q.res !== undefined;
  const team = S.mode === "team" ? `<span class="turn" style="background:${S.qi % 2 ? "var(--goldd)" : "var(--royal)"}">${S.qi % 2 ? "金隊作答" : "藍隊作答"}</span>` : "";
  $("card").innerHTML = `<span class="tag">${q.tag}・第 ${S.qi + 1} 題</span>${team}<div class="ask">${esc(q.ask)}</div>${q.show}`;
  $("answers").innerHTML = q.opts.map((o, i) => `<button class="ans" type="button" data-v="${esc(o.v)}"><span class="k">${i + 1}</span>${o.h}</button>`).join("");
  $("msg").innerHTML = "選出你的答案吧！"; $("sub").textContent = q.sayNow ? "按 🔊 可以再聽一次" : "看清楚再作答喔";
  $("next").classList.add("hide");
  trail(); scores();
  if (q.res !== undefined) mark(q.pick, true); else if (q.sayNow) setTimeout(() => say(q.sayNow), 250);
}
function mark(v, silent) {
  const q = S.qs[S.qi];
  document.querySelectorAll(".ans").forEach((b) => { b.disabled = true; if (b.dataset.v === q.ans) b.classList.add("right"); else if (b.dataset.v === v) b.classList.add("wrong"); });
  const ok = v === q.ans, r = q.rev;
  $("msg").innerHTML = ok ? `${["太棒了！", "答對了！", "好厲害！"][S.qi % 3]} <span class="en">${["Great job!", "Excellent!", "Super!"][S.qi % 3]}</span>` : `差一點點！答案是 <span class="en">${esc(q.ans)}</span>`;
  $("sub").innerHTML = r && r.s ? `<span class="en">${esc(r.s)}</span>　${esc(r.szh || "")}` : "";
  $("next").classList.remove("hide"); $("next").textContent = S.qi + 1 >= S.qs.length ? "看結果 🏆" : "下一題 →";
  if (!silent) { setTimeout(() => $("next").focus(), 50); say(q.full || q.ans); }
}
function answer(v) {
  const q = S.qs[S.qi]; if (S.answered) return; S.answered = true;
  q.res = v === q.ans; q.pick = v;
  if (q.res) { tone([660, 880, 1320]); burst(); if (S.mode === "team") S.team[S.qi % 2]++; else S.score++; }
  else { tone([300, 220], 0.16); if (q.rev && !S.wrong.some((w) => w.s === q.rev.s)) S.wrong.push(q.rev); }
  mark(v); trail(); scores();
}
function next() { if (S.qi + 1 >= S.qs.length) return finish(); S.qi++; renderQ(); }
function finish() {
  show("end"); scores();
  const n = S.qs.length;
  if (S.mode === "team") {
    const [b, g] = S.team;
    $("tIcon").textContent = b === g ? "🤝" : "🏆";
    $("tTitle").textContent = b === g ? "平手！都很棒" : b > g ? "藍隊獲勝！" : "金隊獲勝！";
    $("stars").innerHTML = ""; $("tScore").textContent = `藍隊 ${b} 分　金隊 ${g} 分`;
  } else {
    const st = S.score >= n * 0.9 ? 3 : S.score >= n * 0.6 ? 2 : S.score >= n * 0.3 ? 1 : 0;
    $("tIcon").textContent = ["💪", "🥉", "🥈", "🏆"][st];
    $("tTitle").textContent = ["再挑戰一次！", "拿到寶藏了！", "好棒的尋寶家！", "寶藏大師！"][st];
    $("stars").innerHTML = [0, 1, 2].map((i) => `<span class="${i < st ? "" : "off"}">★</span>`).join("");
    $("tScore").textContent = `答對 ${S.score} / ${n} 題`;
    if (st === 3) { burst(); setTimeout(burst, 300); tone([523, 659, 784, 1046], 0.14); }
  }
  $("revNote").textContent = S.wrong.length ? "按 🔊 聽單字和影片裡的例句。" : "全部答對，沒有要複習的字！";
  $("review").innerHTML = S.wrong.map((r) => `<li><span class="e">${r.e || "⭐"}</span><div style="flex:1"><div class="w">${esc(r.w)} <span class="s">${esc(r.zh || "")}</span></div><div class="s">${esc(r.s || "")}　${esc(r.szh || "")}</div></div><button class="speak sm" type="button" data-say="${esc((r.w || "") + ". " + (r.s || ""))}" aria-label="播放">🔊</button></li>`).join("");
}
function start() { S.qs = build(S.unit, S.total); S.qi = 0; S.score = 0; S.team = [0, 0]; S.wrong = []; show("play"); renderQ(); }

// ---------- confetti ----------
const cv = $("fx"), cx = cv.getContext("2d"); let parts = [], anim = null;
function burst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const c = $("card").getBoundingClientRect(), ox = c.left + c.width / 2, oy = c.top + c.height / 2;
  for (let i = 0; i < 70; i++) parts.push({ x: ox, y: oy, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 12 - 3, r: 4 + Math.random() * 6, c: ["#C9A227", "#E6CB80", "#F6E3A6", "#3C78C3", "#FFFFFF"][rnd(5)], a: 1 });
  if (!anim) anim = requestAnimationFrame(step);
}
function step() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.45; p.a -= 0.012; cx.globalAlpha = Math.max(p.a, 0); cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); });
  parts = parts.filter((p) => p.a > 0 && p.y < cv.height + 20);
  anim = parts.length ? requestAnimationFrame(step) : (cx.clearRect(0, 0, cv.width, cv.height), null);
}

// ---------- events ----------
$("islands").addEventListener("click", (e) => { const b = e.target.closest(".isl"); if (!b) return; S.unit = b.dataset.u; renderIslands(); });
$("islands").addEventListener("dblclick", (e) => { if (e.target.closest(".isl")) start(); });
const seg = (a, b, key, va, vb) => { $(a).onclick = () => { S[key] = va; $(a).setAttribute("aria-pressed", "true"); $(b).setAttribute("aria-pressed", "false"); }; $(b).onclick = () => { S[key] = vb; $(b).setAttribute("aria-pressed", "true"); $(a).setAttribute("aria-pressed", "false"); }; };
seg("mSolo", "mTeam", "mode", "solo", "team");
seg("n10", "n20", "total", 10, 20);
$("voice").onchange = (e) => { S.voice = e.target.checked; };
$("go").onclick = () => { tone([523, 784], 0.1); start(); };
$("again").onclick = start;
$("home").onclick = () => { show("start"); renderIslands(); };
$("quit").onclick = () => { try { speechSynthesis.cancel(); } catch (e) {} show("start"); renderIslands(); };
$("next").onclick = next;
$("answers").addEventListener("click", (e) => { const b = e.target.closest(".ans"); if (b && !b.disabled) answer(b.dataset.v); });
document.addEventListener("click", (e) => { const b = e.target.closest("[data-say]"); if (b) say(b.dataset.say); });
document.addEventListener("keydown", (e) => {
  if ($("play").classList.contains("hide")) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4 && !S.answered) { const b = document.querySelectorAll(".ans")[n - 1]; if (b) answer(b.dataset.v); }
  else if ((e.key === "Enter" || e.key === " ") && S.answered && document.activeElement?.id !== "next") { e.preventDefault(); next(); }
});

// ---------- state keep ----------
window.claude?.hot?.snapshot?.(() => ({ unit: S.unit, mode: S.mode, total: S.total, voice: S.voice, qs: S.qs, qi: S.qi, score: S.score, team: S.team, wrong: S.wrong, screen: ["start", "play", "end"].find((s) => !$(s).classList.contains("hide")) }));
function boot(d) {
  d = d || {};
  ["unit", "mode", "total", "voice"].forEach((k) => { if (d[k] !== undefined) S[k] = d[k]; });
  $("mSolo").setAttribute("aria-pressed", S.mode === "solo"); $("mTeam").setAttribute("aria-pressed", S.mode === "team");
  $("n10").setAttribute("aria-pressed", S.total === 10); $("n20").setAttribute("aria-pressed", S.total === 20); $("voice").checked = S.voice;
  renderIslands();
  if (d.screen === "play" && d.qs && d.qs.length) { Object.assign(S, { qs: d.qs, qi: d.qi, score: d.score, team: d.team, wrong: d.wrong }); show("play"); renderQ(); }
  else if (d.screen === "end" && d.qs) { Object.assign(S, { qs: d.qs, qi: d.qi, score: d.score, team: d.team, wrong: d.wrong }); finish(); }
  else show("start");
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
}
</script>
</body>
</html>
