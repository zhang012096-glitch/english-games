<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ready GO 寶島航海</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion: a classroom game for 8-9 year olds; bright, playful, in the navy-and-gold the teacher chose
   IDEA   a night-sea treasure voyage: sail a gold ship from island to island, each island is a different game
   PICTURE the sea chart itself, then a full scene per island (pitch, sky, cake, park, conveyor, bubbles, monster)
   COLOUR navy sea, gold sand and coins; each scene adds its own world colour (grass green, sky blue, cake pink)
   TYPE   Fredoka for English, Noto Sans TC for Chinese
   LAYOUT one screen: top bar, scene (about 55%), answers under it; phone stacks the same order */
:root{color-scheme:dark;--navy:#0E2341;--navy2:#16325C;--royal:#1F4E8C;--sky:#3C78C3;--gold:#C9A227;--gold2:#E6CB80;--goldd:#9C7414;--ink:#1B2433;--mute:#5A6272;--ok:#2E8B57;--bad:#C0392B}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--navy);color:#fff;font:16px/1.45 "Noto Sans TC","Microsoft JhengHei","PingFang TC","Segoe UI",Arial,sans-serif;overflow-x:clip}
.en{font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,"Noto Sans TC",sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.app{height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;padding:10px max(14px,2vw) 14px;gap:10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(20px,2.8vw,30px);font-weight:900;line-height:1.05;flex:1 1 auto}
.top h1 b{color:var(--gold2)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy2);border:1px solid #2b4b7c;border-radius:999px;padding:5px 12px;font-weight:800;white-space:nowrap}
.chip .n{font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-size:20px;line-height:1}
.chip.on{box-shadow:0 0 0 3px var(--gold2)}
.ghost{border:1px solid #3a5a8a;border-radius:12px;min-height:42px;padding:6px 14px;font-weight:800;color:#dfe7f3}
.btn{min-height:50px;padding:10px 24px;border-radius:16px;background:var(--gold);color:var(--navy);font-weight:900;font-size:19px;box-shadow:0 5px 0 var(--goldd)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--goldd)}
.btn.blue{background:var(--royal);color:#fff;box-shadow:0 5px 0 #12345f}
.hide{display:none!important}
/* ---- map ---- */
#map{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.chart{position:relative;flex:1;min-height:360px;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 30% 20%,#1c3f74 0,#0E2341 60%);border:2px solid #23477c}
.chart svg.sea{position:absolute;inset:0;width:100%;height:100%}
.isle{position:absolute;transform:translate(-50%,-50%);width:clamp(74px,10.5vw,118px);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;z-index:2}
.isle .land{width:100%;aspect-ratio:1.35;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#f6e3a6,#C9A227 70%,#9C7414);display:grid;place-items:center;box-shadow:0 6px 0 #0a1a31,0 0 0 4px rgba(255,255,255,.08);font-size:clamp(28px,4.2vw,46px);transition:transform .15s}
.isle:hover .land{transform:translateY(-4px) rotate(-3deg)}
.isle .nm{font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;font-size:clamp(12px,1.4vw,15px);color:#fff;line-height:1.1;text-shadow:0 2px 0 #0a1a31}
.isle .zh{font-size:12px;color:var(--gold2);font-weight:800}
.isle .st{font-size:13px;letter-spacing:1px;color:var(--gold2);min-height:16px}
.isle.boss .land{background:radial-gradient(ellipse at 50% 35%,#b9a2e6,#6b3fb5 70%,#3d1f75)}
.ship{position:absolute;font-size:clamp(30px,4vw,44px);transform:translate(-50%,-110%);transition:left .9s ease,top .9s ease;z-index:3;filter:drop-shadow(0 4px 0 #0a1a31);pointer-events:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:#0f2a50;border:1px solid #2b4b7c;border-radius:14px;padding:4px}
.seg button{min-height:40px;padding:6px 14px;border-radius:10px;font-weight:900;color:#c9d5e8}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--navy)}
.hint{color:#c9d5e8;font-size:14px}
/* ---- game ---- */
#game{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ghead h2{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:900;flex:1 1 auto}
.dots{display:flex;gap:6px}
.dot{width:16px;height:16px;border-radius:50%;background:#0f2a50;border:2px solid #3a5a8a}
.dot.ok{background:var(--gold);border-color:#f2d98a}.dot.no{background:#3a4560;border-color:#55617d}.dot.now{border-color:var(--gold2);transform:scale(1.25)}
.scene{position:relative;flex:1 1 auto;min-height:250px;border-radius:22px;overflow:hidden;background:#1d3d6e;border:2px solid #23477c}
.prompt{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff;color:var(--ink);border-radius:16px;padding:8px 16px;font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:600;font-size:clamp(18px,2.6vw,28px);text-align:center;box-shadow:0 5px 0 rgba(10,26,49,.35);z-index:6;max-width:92%;display:flex;align-items:center;gap:10px}
.prompt small{display:block;font-family:"Noto Sans TC";font-size:13px;color:var(--mute);font-weight:700}
.say{flex:none;width:40px;height:40px;border-radius:50%;background:var(--royal);color:#fff;font-size:20px;box-shadow:0 3px 0 #12345f}
.ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ctl.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-height:64px;border-radius:16px;background:#fff;color:var(--ink);font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:600;font-size:clamp(18px,2.4vw,25px);padding:8px 12px;box-shadow:0 5px 0 #0a1a31;border:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.opt:hover:not([disabled]){border-color:var(--gold2)}
.opt.right{background:#e3f4ea;border-color:var(--ok)}
.opt.wrong{background:#f9e3e0;border-color:var(--bad);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;font-size:clamp(38px,7vw,76px);color:#fff;text-shadow:0 5px 0 rgba(10,26,49,.5);pointer-events:none;z-index:9;transition:all .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.nextbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;background:var(--navy2);border:1px solid #2b4b7c;border-radius:16px;padding:6px 12px}
.nextbar .msg{font-weight:900}
.nextbar .msg .en{color:var(--gold2)}
/* soccer */
.pitch{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#2f8f46 0 70px,#2a8240 70px 140px)}
.goal{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);width:min(70%,520px);height:38%;border:8px solid #fff;border-bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 16px),repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 16px)}
.keeper{position:absolute;left:50%;bottom:34%;width:70px;height:110px;transform:translateX(-50%);transition:transform .45s cubic-bezier(.3,1.4,.5,1);z-index:3}
.ball{position:absolute;left:50%;bottom:6%;font-size:46px;transform:translate(-50%,0);transition:all .55s cubic-bezier(.2,.8,.3,1);z-index:4}
.aim{position:absolute;bottom:42%;font-size:30px;opacity:.85;transform:translateX(-50%)}
.score{position:absolute;right:14px;bottom:12px;background:#0E2341;border-radius:12px;padding:4px 12px;font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;font-size:22px;z-index:5}
/* sky */
.skybg{position:absolute;inset:0;background:linear-gradient(#5aa7e6,#bfe3ff)}
.cloud{position:absolute;width:30%;min-height:68px;background:#fff;border-radius:60px;box-shadow:0 6px 0 rgba(10,26,49,.15);display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:600;font-size:clamp(16px,2.2vw,24px);padding:8px 14px;text-align:center;border:3px solid transparent}
.cloud:hover:not([disabled]){border-color:var(--gold)}
.cloud.right{border-color:var(--ok);background:#e3f4ea}.cloud.wrong{border-color:var(--bad);background:#f9e3e0}
.plane{position:absolute;font-size:52px;transition:left .9s ease-in-out,top .9s ease-in-out,transform .4s;z-index:4}
.passenger{position:absolute;left:4%;bottom:8%;background:#fff;color:var(--ink);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(10,26,49,.25)}
.passenger .flag{font-size:44px;line-height:1}
.stamp{position:absolute;right:6%;bottom:8%;border:5px solid var(--bad);color:var(--bad);border-radius:12px;padding:4px 12px;font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;font-size:26px;transform:rotate(-12deg) scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1);background:rgba(255,255,255,.85)}
.stamp.show{transform:rotate(-12deg) scale(1)}
/* cake */
.party{position:absolute;inset:0;background:radial-gradient(circle at 50% 110%,#f7c6dc 0,#b0549a 55%,#5b2a6e)}
.cake{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(64%,420px)}
.flame{transition:opacity .3s,transform .3s;transform-origin:center bottom}
.flame.off{opacity:0;transform:scale(.3)}
/* weather */
.wx{position:absolute;inset:0;transition:background .6s}
.wx .ground{position:absolute;left:0;right:0;bottom:0;height:28%;transition:background .6s}
.drop{position:absolute;top:-20px;width:3px;height:18px;background:#cfe7ff;border-radius:3px;animation:fall .8s linear infinite}
.flake{position:absolute;top:-20px;color:#fff;font-size:18px;animation:fall 3s linear infinite}
.leaf{position:absolute;top:-30px;font-size:24px;animation:fall 4s linear infinite}
@keyframes fall{to{transform:translateY(calc(100vh)) rotate(240deg)}}
.wind{position:absolute;height:4px;border-radius:4px;background:rgba(255,255,255,.8);animation:blow 1.6s linear infinite}
@keyframes blow{from{transform:translateX(-120%)}to{transform:translateX(900%)}}
.fog{position:absolute;inset:0;background:linear-gradient(rgba(230,236,244,.75),rgba(230,236,244,.92));animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{opacity:.7}}
.sunbig{position:absolute;right:10%;top:16%;font-size:84px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prop{position:absolute;font-size:64px;bottom:14%}
/* spell */
.board{position:absolute;inset:0;background:linear-gradient(#1F4E8C,#0E2341);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 12px 12px}
.clue{font-size:clamp(56px,9vw,90px);line-height:1}
.clue.txt{font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;color:var(--gold2)}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot{width:clamp(38px,5.6vw,56px);height:clamp(46px,6.6vw,64px);border-radius:12px;background:#0f2a50;border:3px dashed var(--gold2);display:grid;place-items:center;font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;font-size:clamp(24px,3.6vw,36px);color:#fff}
.slot.f{background:var(--gold);color:var(--navy);border-style:solid}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:clamp(46px,6vw,60px);height:clamp(50px,6.6vw,64px);border-radius:12px;background:#fff;color:var(--navy);font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;font-size:clamp(24px,3.6vw,34px);box-shadow:0 5px 0 #0a1a31}
.tile[disabled]{opacity:.25}
/* dress */
.studio{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#fff3c9,#e6cb80 45%,#9c7414)}
.runway{position:absolute;left:28%;bottom:0;transform:translateX(-50%);width:46%;height:14%;background:linear-gradient(#8b1e3f,#5c1229);border-radius:50% 50% 0 0}
.kid{position:absolute;left:28%;bottom:4%;transform:translateX(-50%);height:90%;aspect-ratio:.55}
.kid svg{width:100%;height:100%}
.wear{position:absolute;left:50%;transform:translateX(-50%);display:grid;place-items:center;transition:transform .25s}
.wear svg{width:100%;height:100%}
.wear.pop{animation:pop .3s}
@keyframes pop{50%{transform:translateX(-50%) scale(1.25)}}
.ward{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.wb{background:#fff;border-radius:14px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:600;font-size:13px;box-shadow:0 4px 0 #0a1a31;border:3px solid transparent;padding:4px}
.wb .e{font-size:30px;line-height:1.1;width:34px;height:34px;display:grid;place-items:center}
.wb .e svg{width:34px;height:34px}
.wb[aria-pressed=true]{border-color:var(--gold);background:#fff8e4}
/* park */
.park{position:absolute;inset:0;background:linear-gradient(#9fd3ff 0 45%,#5fbf6a 45%)}
.tree{position:absolute;font-size:70px;bottom:40%}
.actor{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);display:flex;align-items:flex-end;gap:4px;font-size:clamp(60px,10vw,96px);line-height:1;transition:transform .4s}
.mag{position:absolute;left:50%;top:58%;width:clamp(180px,26vw,250px);aspect-ratio:1;border-radius:50%;border:10px solid #1B2433;transform:translate(-50%,-50%);box-shadow:0 0 0 2000px rgba(14,35,65,.55);pointer-events:none;animation:scan 1.2s ease-out}
.mag::after{content:"";position:absolute;right:-60px;bottom:-60px;width:80px;height:20px;background:#1B2433;border-radius:10px;transform:rotate(45deg)}
@keyframes scan{from{transform:translate(-130%,-60%)}to{transform:translate(-50%,-50%)}}
/* conveyor */
.factory{position:absolute;inset:0;background:linear-gradient(#24427a,#0E2341)}
.belt{position:absolute;left:0;right:0;bottom:16%;height:46px;background:repeating-linear-gradient(90deg,#2b2f3a 0 30px,#3d4350 30px 60px);border-top:6px solid #8a93a6;border-bottom:6px solid #8a93a6;animation:roll .8s linear infinite}
@keyframes roll{to{background-position:60px 0}}
.item{position:absolute;bottom:calc(16% + 52px);left:-30%;width:clamp(110px,15vw,150px);display:flex;flex-direction:column;align-items:center;transition:left 1.2s cubic-bezier(.3,.9,.4,1)}
.item .thing{font-size:clamp(64px,9vw,88px);line-height:1;width:clamp(80px,11vw,100px);height:clamp(80px,11vw,100px);display:grid;place-items:center}
.item .thing svg{width:100%;height:100%}
.tag{background:#fff;color:var(--ink);border-radius:10px;padding:4px 10px;font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.tag .f{font-size:26px}
/* bubbles */
.sea{position:absolute;inset:0;background:linear-gradient(#3C78C3,#0E2341)}
.bub{position:absolute;width:clamp(86px,11vw,112px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(190,225,255,.55) 40%,rgba(120,180,240,.35));border:2px solid rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;font-size:clamp(14px,1.8vw,18px);line-height:1.05;touch-action:manipulation}
.bub .e{font-size:clamp(28px,3.6vw,36px)}
.bub.popd{animation:popout .35s forwards}
.bub.nope{animation:shake .35s}
@keyframes popout{to{transform:scale(1.6);opacity:0}}
.timer{position:absolute;left:12px;right:12px;bottom:10px;height:12px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden;z-index:5}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.target{font-size:clamp(30px,4vw,42px);color:var(--goldd)}
/* boss */
.lair{position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,#4a2a7a,#1a0f33)}
.monster{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:min(40%,250px);transition:transform .2s}
.monster.hit{animation:hit .4s}
@keyframes hit{20%{transform:translate(-46%,-50%) rotate(8deg)}60%{transform:translate(-54%,-50%) rotate(-8deg)}}
.hp{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:min(60%,360px);height:18px;border-radius:10px;background:rgba(255,255,255,.2);overflow:hidden;z-index:5}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#e74c3c,#ff8a65);transition:width .4s}
.hearts{position:absolute;left:14px;bottom:12px;font-size:28px;z-index:5}
.dmg{position:absolute;left:58%;top:34%;font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-weight:700;font-size:44px;color:var(--gold2);animation:up 1s forwards;z-index:6}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
/* result */
.result{position:fixed;inset:0;background:rgba(6,16,32,.78);display:grid;place-items:center;z-index:20;padding:16px}
.rcard{background:#fff;color:var(--ink);border-radius:26px;padding:24px;text-align:center;max-width:440px;width:100%;box-shadow:0 10px 0 #0a1a31}
.rcard .big{font-size:84px;line-height:1.1}
.rcard h3{margin:6px 0;font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-size:36px;color:var(--navy);line-height:1.05}
.rstars{font-size:46px;color:var(--gold);letter-spacing:6px}
.rstars .off{color:#d9dee8}
.rcard p{margin:6px 0 14px;color:var(--mute);font-weight:700}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (max-width:640px){.ctl{grid-template-columns:minmax(0,1fr)}.ward{grid-template-columns:repeat(4,minmax(0,1fr))}.chart{min-height:560px}.opt{min-height:54px}.isle{width:68px}.isle .zh{display:none}.isle .nm{font-size:11px}.u5p{max-width:56%!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <div class="top">
    <h1>Ready, GO! 4 <b>寶島航海</b></h1>
    <span class="chip" id="starChip">⭐ <span class="n" id="starN">0</span> / 36</span>
    <span class="chip hide" id="tB">🔵 藍隊 <span class="n" id="tBn">0</span></span>
    <span class="chip hide" id="tG">🟡 金隊 <span class="n" id="tGn">0</span></span>
  </div>

  <section id="map">
    <div class="chart" id="chart">
      <svg class="sea" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
        <defs><pattern id="wv" width="80" height="40" patternUnits="userSpaceOnUse"><path d="M0 20 q20 -12 40 0 t40 0" fill="none" stroke="#2a5291" stroke-width="3"/></pattern></defs>
        <rect width="1000" height="600" fill="url(#wv)" opacity=".55"/>
        <path id="route" d="" fill="none" stroke="#E6CB80" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" opacity=".8"/>
      </svg>
      <div class="ship" id="ship">⛵</div>
    </div>
    <div class="legend">
      <div class="seg" role="group" aria-label="遊戲模式">
        <button type="button" id="mSolo" aria-pressed="true">一個人航海</button>
        <button type="button" id="mTeam" aria-pressed="false">藍隊 vs 金隊</button>
      </div>
      <span class="hint">點一座島開始！每座島是不同的遊戲，最後挑戰紫色怪獸島 👾</span>
      <label class="hint"><input type="checkbox" id="voice" checked> 🔊 唸出英文</label>
    </div>
  </section>

  <section id="game" class="hide">
    <div class="ghead">
      <button class="ghost" id="back" type="button">← 回海圖</button>
      <h2 id="gTitle"></h2>
      <span class="chip hide" id="turn"></span>
      <div class="dots" id="dots"></div>

function spellRound(G, A, word, clueHtml, clueTxt, zh) {
  const letters = word.replace(/[^A-Za-z]/g, "").split("");
  let tiles = shuffle(letters.map((ch, i) => ({ ch, i })));
  if (tiles.map((t) => t.ch).join("") === letters.join("") && letters.length > 1) tiles = tiles.reverse();
  let typed = []; G.data.retry = false;
  scene().innerHTML = `<div class="board"><div class="clue ${clueTxt ? "txt" : ""}">${clueHtml}</div><div class="slots" id="slots"></div><div class="hint" style="color:#dfe7f3">${esc(zh)}</div></div>`;
  A.prompt("Spell it! 拼拼看", word, "按字母排出正確單字");
  const draw = () => {
    $("slots").innerHTML = letters.map((_, i) => `<span class="slot ${typed[i] ? "f" : ""}">${typed[i] ? typed[i].ch : ""}</span>`).join("");
    ctl().className = "";
    ctl().innerHTML = `<div class="tiles">${tiles.map((t, k) => `<button class="tile" type="button" data-k="${k}" ${typed.includes(t) ? "disabled" : ""}>${t.ch}</button>`).join("")}<button class="tile" type="button" data-k="undo" style="background:#E6CB80" aria-label="刪除">⌫</button></div>`;
  };
  draw();
  window.__ans = () => { typed = []; letters.forEach((ch) => { const t = tiles.find((x) => x.ch === ch && !typed.includes(x)); typed.push(t); }); check(); };
  const check = () => {
    draw();
    if (typed.length < letters.length) return;
    const ok = typed.map((t) => t.ch).join("") === letters.join("");
    if (!ok && !G.data.retry) { G.data.retry = true; sfx.no(); $("slots").style.animation = "shake .35s"; setTimeout(() => { typed = []; $("slots").style.animation = ""; draw(); $("msg").textContent = "差一點！再試一次（最後一次機會）"; }, 600); return; }
    G.data.retry = false;
    ctl().querySelectorAll(".tile").forEach((b) => (b.disabled = true));
    A.result(ok, `拼對了！<span class="en">${esc(word)}</span>`, `答案是 <span class="en">${esc(word)}</span>`, word);
  };
  ctl().onclick = (e) => { const b = e.target.closest(".tile"); if (!b || G.answered) return; sfx.pop(); if (b.dataset.k === "undo") typed.pop(); else typed.push(tiles[+b.dataset.k]); check(); };
}

    const put = (i) => { const [n, e, slot] = CLOTHES[i]; worn[slot] = worn[slot] === n ? undefined : n; const box = $("w_" + slot); box.innerHTML = worn[slot] ? `<span style="font-size:clamp(40px,7vw,74px);line-height:1;width:100%;display:grid;place-items:center">${ico(e)}</span>` : ""; box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop"); sfx.pop(); draw(); };
    window.__ans = () => { Object.keys(worn).forEach((k) => { worn[k] = undefined; $("w_" + k).innerHTML = ""; }); want.forEach((w) => put(CLOTHES.indexOf(w))); $("done").click(); };
    c.onclick = (e) => {
      if (G.answered) return;
      const b = e.target.closest(".wb"); if (b) return put(+b.dataset.i);
      if (e.target.closest("#done")) {
        const ok = want.every((w) => worn[w[2]] === w[0]) && Object.entries(worn).filter(([, v]) => v).length === want.length;
        if (ok) G.data.tt = "FASHION!";
        A.result(ok, `超有型！<span class="en">${esc(sentence)}</span>`, `再對一次指令：<span class="en">${esc(sentence)}</span>`, sentence);
      }
    };
  } };

// U6 park detective
GAMES.u6 = { unit: "Unit 6", name: "公園動作", icon: "🔍", title: "公園小偵探：他們在做什麼？", rounds: 5, help: "用放大鏡看清楚，再回答！",
  round(G, A) {

// U7 & U8 lost and found conveyor
function beltRound(G, A, items, mode) {
  const [n, e, pl] = pick(items);
  const o = pick(OWN);
  scene().innerHTML = `<div class="factory"></div><div class="belt"></div><div class="item" id="item"><div class="thing">${ico(e)}</div><div class="tag"><span class="f">${o.f}</span>${esc(o.tag)}</div></div><div style="position:absolute;right:12px;top:70px;font-size:40px">📦</div>`;
  setTimeout(() => { const it = $("item"); if (it) it.style.left = "calc(50% - 60px)"; }, 60);
  const q = pl ? `Whose ${n} are these?` : `Whose ${n} is it?`;
  const be = pl ? "They're" : "It's";
  let ans, opts;
  if (mode === "pron") { ans = `${be} ${o.pron}.`; opts = q3(ans, o.wrongP.map((w) => `${be} ${w}.`)); }
  else if (o.tag === "me") { ans = pl ? `They're my ${n}.` : `It's my ${n}.`; opts = q3(ans, [`${be} me ${n}.`, `${be} I ${n}.`]); }
  else { ans = `${be} ${o.poss} ${n}.`; opts = q3(ans, [`${be} ${o.wrongN} ${n}.`, `${be} ${o.pron} ${n}.`]); }
  A.prompt(esc(q), q, mode === "pron" ? "看名牌，用 mine / his / hers / theirs 回答" : "看名牌，說出是誰的");
  A.options(opts, ans, (v, ok) => A.result(ok, `物歸原主！<span class="en">${esc(ans)}</span>`, `答案是 <span class="en">${esc(ans)}</span>`, ans));
}
GAMES.u7 = { unit: "Unit 7", name: "這是我的", icon: "🕶️", title: "失物招領輸送帶", rounds: 5, help: "看名牌，物品是誰的？", round(G, A) { beltRound(G, A, ACCS, "pron"); } };
GAMES.u8 = { unit: "Unit 8", name: "上學日", icon: "✏️", title: "文具工廠：這是誰的？", rounds: 5, help: "看名牌，說出是誰的文具", round(G, A) { beltRound(G, A, STAT, rnd(3) ? "name" : "pron"); } };

// Phonics bubble pop
GAMES.ph = { unit: "Phonics", name: "拼讀泡泡", icon: "🫧", title: "拼讀泡泡大作戰", rounds: 3, help: "只戳破有目標字母的泡泡！",
  init(G) { G.data.groups = shuffle(Object.keys(PHW)).slice(0, 3); },
  round(G, A) {
    const tg = G.data.groups[G.round];
    const good = PHW[tg], bad = ALLW.filter((w) => !w[0].includes(tg));
    const need = 5; let got = 0, miss = 0, live = true;
    scene().innerHTML = `<div class="sea"></div><div class="timer"><i id="tbar"></i></div>`;
    A.prompt(`戳破有 <b class="target en">${tg}</b> 的泡泡！`, null, `目標：找到 ${need} 個`);
    ctl().className = ""; ctl().innerHTML = `<div class="nextbar" style="justify-content:center"><span class="msg" id="bcount">🫧 0 / ${need}</span></div>`;
    const sc = scene(); const bubs = [];
    const spawn = () => {
      if (!live) return;
      const isGood = Math.random() < 0.45, w = isGood ? pick(good) : pick(bad);
      const b = document.createElement("button"); b.type = "button"; b.className = "bub"; b.dataset.good = isGood ? 1 : 0; b.dataset.w = w[0];
      const at = w[0].indexOf(tg);
      b.innerHTML = `<span class="e">${w[1]}</span><span>${esc(w[0])}</span>`;
      const W = sc.clientWidth, H = sc.clientHeight;
      const o = { el: b, x: 10 + Math.random() * (W - 130), y: H, v: 0.6 + Math.random() * 0.7, ph: Math.random() * 6 };
      b.style.left = o.x + "px"; b.style.top = o.y + "px";
      sc.appendChild(b); bubs.push(o);
    };
    let t0 = performance.now(); const DUR = 25000;
    const step = (t) => {
      if (!live) return;
      bubs.forEach((o) => { o.y -= o.v * 1.4; o.ph += 0.03; o.el.style.top = o.y + "px"; o.el.style.left = (o.x + Math.sin(o.ph) * 14) + "px"; if (o.y < -130) { o.el.remove(); o.dead = true; } });
      for (let i = bubs.length - 1; i >= 0; i--) if (bubs[i].dead) bubs.splice(i, 1);
      const left = Math.max(0, 1 - (t - t0) / DUR); const tb = $("tbar"); if (tb) tb.style.width = left * 100 + "%";
      if (left <= 0) return end();
      window.__bubA = requestAnimationFrame(step);
    };
    clearInterval(window.__bubT); window.__bubT = setInterval(spawn, 900); spawn(); spawn();
    window.__bubA = requestAnimationFrame(step);
    const end = () => { if (!live) return; live = false; clearInterval(window.__bubT); cancelAnimationFrame(window.__bubA); sc.querySelectorAll(".bub").forEach((b) => (b.disabled = true)); A.result(got >= need, `全部找到了！<span class="en">${tg}</span> 好厲害`, `時間到！找到 ${got} 個 <span class="en">${tg}</span>`, PHW[tg].map((w) => w[0]).join(", ")); };
    window.__ans = () => { got = need; end(); };
    sc.onclick = (e) => {
      const b = e.target.closest(".bub"); if (!b || !live || b.disabled) return;
      if (b.dataset.good === "1") { b.disabled = true; b.classList.add("popd"); sfx.pop(); say(b.dataset.w, 0.9); got++; $("bcount").textContent = `🫧 ${got} / ${need}`; setTimeout(() => b.remove(), 360); if (got >= need) end(); }
      else { miss++; b.classList.remove("nope"); void b.offsetWidth; b.classList.add("nope"); sfx.no(); }
    };
  } };

// Final boss
GAMES.boss = { unit: "Final", name: "怪獸島", icon: "👾", title: "打倒單字怪獸！", rounds: 99, help: "答對就攻擊怪獸，答錯會被打掉一顆愛心！",
  init(G) { G.data.hp = 8; G.data.hearts = 3; },
  round(G, A) {
    if (G.data.hp <= 0 || G.data.hearts <= 0) return;
    const gens = [
      () => { const [w, e] = pick(SPORTS); return [`${e} I like to play ___.`, w, others(SPORTS, 4, [w]).map((x) => x[0])]; },
      () => { const [c, f, l] = pick(COUNTRIES); return [`${f} I come from ${c}. I speak ___.`, l, ["English", "French", "Korean", "Chinese", "Japanese"].filter((x) => x !== l)]; },
      () => { const i = rnd(11); return [`What month comes after ${MONTHS[i]}?`, MONTHS[i + 1], others(MONTHS, 5, MONTHS[i + 1])]; },
      () => { const w = pick(WX); return [`${w.prop} How's the weather?`, w.a, others(WX, 5, w, (x) => x.k).map((x) => x.a)]; },
      () => { const i = rnd(12); return [`${ORDN[i]} = ?`, ORD[i], others(ORD, 5, ORD[i])]; },
      () => { const c = pick(CLOTHES.filter((x) => x[1].length <= 3)); return [`${c[1]} What is this?`, c[0], others(CLOTHES, 5, c).map((x) => x[0])]; },
      () => { const [a, e] = pick(ACTS); return [`${e} Is he ${a}?`, "Yes, he is.", ["Yes, he does.", "Yes, he do."]]; },
      () => pick([["This necklace is ___. 🙋", "mine", ["my", "me"]], ["Those belts are ___. 👧", "hers", ["her", "she"]], ["Whose glue is it? 👦 Ben", "It's Ben's.", ["It's Ben.", "It's him."]]]),
      () => { const tg = pick(["sh", "ch", "ph", "dr", "sw"]); const w = pick(PHW[tg]); return [`Which word has "${tg}"?`, w[0], shuffle(ALLW.filter((x) => !x[0].includes(tg))).slice(0, 4).map((x) => x[0])]; },
    ];
    const [q, ans, wr] = pick(gens)();
    const opts = q3(ans, wr);
    scene().innerHTML = `<div class="lair"></div><div class="hp"><i id="hpb" style="width:${G.data.hp / 8 * 100}%"></i></div>
      <svg class="monster" id="mon" viewBox="0 0 240 220"><path d="M50 60 L30 10 L80 44 M190 60 L210 10 L160 44" fill="#9b5de5" stroke="#2b1650" stroke-width="6" stroke-linejoin="round"/><path d="M20 140 C20 60 70 34 120 34 C170 34 220 60 220 140 C220 196 180 212 120 212 C60 212 20 196 20 140Z" fill="#9b5de5" stroke="#2b1650" stroke-width="7"/><ellipse cx="120" cy="160" rx="60" ry="40" fill="#c7a5f2"/><circle cx="88" cy="108" r="24" fill="#fff" stroke="#2b1650" stroke-width="5"/><circle cx="152" cy="108" r="24" fill="#fff" stroke="#2b1650" stroke-width="5"/><circle cx="94" cy="112" r="10" fill="#2b1650"/><circle cx="146" cy="112" r="10" fill="#2b1650"/><path d="M92 160 q28 22 56 0" fill="#2b1650"/><path d="M104 162 l6 10 l6 -10 M126 162 l6 10 l6 -10" fill="#fff"/></svg>
      <div class="hearts" id="hearts">${"❤️".repeat(G.data.hearts)}${"🖤".repeat(3 - G.data.hearts)}</div>`;
    A.prompt(esc(q), q.replace(/^[^A-Za-z"]+/, ""), "答對就攻擊！");
    A.options(opts, ans, (v, ok) => {
      if (ok) { G.data.hp--; $("mon").classList.add("hit"); $("hpb").style.width = G.data.hp / 8 * 100 + "%"; const d = document.createElement("div"); d.className = "dmg"; d.textContent = "-1"; scene().appendChild(d); }
      else { G.data.hearts--; $("hearts").innerHTML = "❤️".repeat(G.data.hearts) + "🖤".repeat(3 - G.data.hearts); }
      A.result(ok, `命中！<span class="en">${esc(ans)}</span>`, `怪獸反擊！答案是 <span class="en">${esc(ans)}</span>`, ans);
      if (G.data.hp <= 0 || G.data.hearts <= 0) { G.total = G.round + 1; $("next").textContent = "看結果 🏆"; }
    });
  },
  };

// ===== confetti =====
const cv = $("fx"), cx = cv.getContext("2d"); let parts = [], anim = null;
function burst(el, n = 60) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const r = el ? el.getBoundingClientRect() : { left: 0, top: 0, width: innerWidth, height: innerHeight / 2 };
  for (let i = 0; i < n; i++) parts.push({ x: r.left + r.width / 2, y: r.top + r.height / 2, vx: (Math.random() - 0.5) * 15, vy: -Math.random() * 12 - 3, r: 4 + Math.random() * 6, c: ["#C9A227", "#E6CB80", "#F6E3A6", "#3C78C3", "#FFFFFF", "#F15BB5"][rnd(6)], a: 1 });
  if (!anim) anim = requestAnimationFrame(stepFx);
}
function stepFx() { cx.clearRect(0, 0, cv.width, cv.height); parts.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.42; p.a -= 0.012; cx.globalAlpha = Math.max(p.a, 0); cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); }); parts = parts.filter((p) => p.a > 0 && p.y < cv.height + 20); anim = parts.length ? requestAnimationFrame(stepFx) : (cx.clearRect(0, 0, cv.width, cv.height), null); }

// ===== events =====
$("chart").addEventListener("click", (e) => { const b = e.target.closest(".isle"); if (b) { sfx.whoosh(); startGame(b.dataset.k); } });
$("back").onclick = toMap; $("rMap").onclick = toMap;
$("rAgain").onclick = () => { $("result").classList.add("hide"); startGame(G.k); };
$("next").onclick = () => {
  if (G.k === "boss" && (G.data.hp <= 0 || G.data.hearts <= 0)) {
    const win = G.data.hp <= 0;
    G.right = win ? 3 : 0;
    return finish({ stars: win ? (G.data.hearts === 3 ? 3 : G.data.hearts === 2 ? 2 : 1) : 0, icon: win ? "🏆" : "👾", title: win ? "打倒怪獸！寶藏是你的！" : "怪獸太強了！", text: win ? `剩下 ${G.data.hearts} 顆愛心` : "回去各個島練習，再來挑戰！" });
  }
  G.round++; nextRound();
};
document.addEventListener("click", (e) => { const b = e.target.closest("[data-say]"); if (b) say(b.dataset.say); });
document.addEventListener("keydown", (e) => {
  if ($("game").classList.contains("hide")) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 3 && !G.answered) { const b = ctl().querySelectorAll(".opt")[n - 1]; if (b) b.click(); }
  if ((e.key === "Enter") && G.answered && document.activeElement !== $("next")) $("next").click();
});
$("mSolo").onclick = () => { S.mode = "solo"; $("mSolo").setAttribute("aria-pressed", "true"); $("mTeam").setAttribute("aria-pressed", "false"); $("tB").classList.add("hide"); $("tG").classList.add("hide"); $("starChip").classList.remove("hide"); };
$("mTeam").onclick = () => { S.mode = "team"; S.team = [0, 0]; teamScores(); $("mTeam").setAttribute("aria-pressed", "true"); $("mSolo").setAttribute("aria-pressed", "false"); $("tB").classList.remove("hide"); $("tG").classList.remove("hide"); $("starChip").classList.add("hide"); };
$("voice").onchange = (e) => (S.voice = e.target.checked);
window.claude?.hot?.snapshot?.(() => ({ stars: S.stars, mode: S.mode, team: S.team, at: S.at }));
function boot(d) { d = d || {}; if (d.stars) Object.assign(S.stars, d.stars); if (d.at) S.at = d.at; if (d.mode === "team") $("mTeam").click(); if (d.team) { S.team = d.team; teamScores(); } drawMap(); }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
}
